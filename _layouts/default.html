<!doctype html>
<html lang="{{ page.lang | default: 'en' }}"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }} · {{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="{{ page.lang }}" href="{{ page.url | absolute_url }}">
{% if page.alternate %}<link rel="alternate" hreflang="{% if page.lang == 'en' %}it{% else %}en{% endif %}" href="{{ page.alternate | absolute_url }}">{% endif %}
<meta property="og:type" content="website"><meta property="og:title" content="{{ page.title | escape }}"><meta property="og:description" content="{{ page.description | default: site.description | escape }}"><meta property="og:url" content="{{ page.url | absolute_url }}"><meta name="twitter:card" content="summary">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{ink:'#111318',slate:'#20252E',paper:'#F6F5F0',mist:'#B8C0CB',signal:'#FF6B35',warm:'#FAF9F6'}}}}</script>
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head><body>
<a class="skip" href="#main">{% if page.lang == 'it' %}Vai al contenuto{% else %}Skip to content{% endif %}</a>
{% include header.html %}
<main id="main">{{ content }}</main>
{% include footer.html %}
<script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</body></html>
